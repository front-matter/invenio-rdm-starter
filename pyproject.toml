[project]
name = "invenio-rdm-starter"
version = "14.0.7.1"
description = "Starter for the invenio-rdm turn-key research data management repository"
authors = [{ name = "Martin Fenner", email = "martin@front-matter.de" }]
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
# The same dependencies as Rogue Scholar, except invenio-archive-it (Archive-It
# subscription).
dependencies = [
    "invenio-app-rdm>=14.0.7,<15.0",
    "invenio-search[opensearch2]>=3.1.2,<3.2.0",
    "invenio-s3>=3.0.2",
    "invenio-oauthclient>=8,<11",
    "invenio-rdm-records>=32.3.3,<33",
    "setuptools>=70,<81",
    "gunicorn~=23.0.0",
    "commonmeta-py[backend]>=0.318,<1",
    "commonmeta-rs>=0.12.20,<1",
    "invenio-pidbox>=0.7.14,<1",
    "invenio-logging",
    "structlog>=25.0",
    "prometheus-flask-exporter>=0.23.1",         # no [sentry] extra
    "sentry-sdk[flask]>=2.0,<3",
    "structlog-sentry>=2.1.0",
]

[tool.uv]
# The image installs this project as a wheel (uv sync --no-editable) with uv's
# cache on a build cache mount, and uv only rebuilds that wheel when a cache key
# changes. With the default keys, which watch pyproject.toml but not the code,
# an edit to site/invenio_rdm_starter would ship the previously built wheel.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "site/invenio_rdm_starter/**/*.py" },
    { file = "site/invenio_rdm_starter/translations/**/*.mo" },
]

[tool.uv.sources]
# The authlib rewrite, as for Rogue Scholar (see invenio_rdm_starter.oidc).
invenio-oauthclient = { git = "https://github.com/max-moser/invenio-oauthclient", branch = "mm/authlib" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.4.2", "pytest-invenio>=4.0.0", "ruamel-yaml>=0.19.1"]

[tool.hatch.build]
include = [
    "site/invenio_rdm_starter/*.py",
    "site/invenio_rdm_starter/translations/**/*.mo",
]

[tool.hatch.build.targets.wheel]
sources = { "site" = "" }

[project.entry-points."invenio_base.blueprints"]
invenio_rdm_starter = "invenio_rdm_starter.views:create_blueprint"

[project.entry-points."invenio_base.api_blueprints"]
invenio_rdm_starter = "invenio_rdm_starter.views:create_api_blueprint"

# The translations of the Starter's own strings, in
# invenio_rdm_starter/translations.
[project.entry-points."invenio_i18n.translations"]
invenio_rdm_starter = "invenio_rdm_starter"

[project.entry-points."invenio_config.module"]
invenio_rdm_starter = "invenio_rdm_starter.config"

[project.entry-points."invenio_base.finalize_app"]
invenio_rdm_starter = "invenio_rdm_starter.errors:finalize_app"
# The menubar without the inbox and the "+" menu (invenio_rdm_starter.menus).
invenio_rdm_starter_menus = "invenio_rdm_starter.menus:finalize_app"
# The front page's subtitle and sidebar from pages (invenio_rdm_starter.pages).
invenio_rdm_starter_pages = "invenio_rdm_starter.pages:finalize_app"
# Whether there are records, for the front page (invenio_rdm_starter.frontpage).
invenio_rdm_starter_frontpage = "invenio_rdm_starter.frontpage:finalize_app"
# The OpenAlex subject a search is for, for its header (invenio_rdm_starter.subjects).
invenio_rdm_starter_subjects = "invenio_rdm_starter.subjects:finalize_app"

# The Starter's jobs: the Jobs dashboard lists them, Celery runs their tasks.
[project.entry-points."invenio_jobs.jobs"]
starter_delete_all_records = "invenio_rdm_starter.jobs:DeleteAllRecordsJob"
starter_create_starter_pack_communities = "invenio_rdm_starter.jobs:CreateStarterPackCommunitiesJob"
starter_move_records_to_starter_pack = "invenio_rdm_starter.jobs:MoveRecordsToStarterPackJob"

[project.entry-points."invenio_celery.tasks"]
# Deleting all records (Administration → Jobs → Delete all records).
invenio_rdm_starter_reset = "invenio_rdm_starter.reset"
# The Starter Packs' communities (Administration → Jobs).
invenio_rdm_starter_packs = "invenio_rdm_starter.starter_packs"

[tool.ruff]
line-length = 88
include = ["pyproject.toml", "site/**/*.py"]

[project.optional-dependencies]
docs = ["mkdocs-material>=9.7.0"]
actions = ["commonmeta-py[backend]>=0.309,<1"]
