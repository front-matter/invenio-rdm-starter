# Starter Packs: the content an InvenioRDM Starter instance can start with,
# each a community of type "starterpack" (app_data/vocabularies/
# community_types.yaml). The "Create starter pack communities" job
# (invenio_rdm_starter.starter_packs) creates the community of each pack that
# doesn't have one; a pack's community is found again by its slug.
#
# Each pack: slug, title, logo (an image in app_data/starter_packs, at most
# 1 MB, set while the community has none), description, website, and
# custom_fields, the
# community's rs: fields that select its works (invenio_rdm_starter.
# custom_fields): rs:issn, rs:doi (the DOI of a blog or journal), rs:prefix
# (a DOI prefix), rs:ror (the ROR id of the authors' organization),
# rs:language (a languages vocabulary id) and rs:license (a licenses
# vocabulary id).
- slug: joss
  title: Journal of Open Source Software
  logo: starter_packs/joss.png
  description: >-
    Archive of the Journal of Open Source Software (JOSS):
    papers describing Open Source research software, with their PDFs and software archives.
  website: https://joss.theoj.org/
  custom_fields:
    rs:issn: 2475-9066
    rs:prefix: "10.21105"
    rs:language: eng
    rs:license: cc-by-4.0
- slug: mhh
  title: Medizinische Hochschule Hannover
  logo: starter_packs/mhh.png
  website: https://mhh.de/
  custom_fields:
    rs:ror: "00f2yqf98"
    rs:language: deu
