# Starter Packs: the content an InvenioRDM Starter instance can start with,
# each a collection of works defined by one PID and modelled as a community.
# The "Sync starter packs" job (invenio_rdm_starter.starter_packs) creates the
# community of each pack that doesn't have one, and gives an existing one the
# pack's type; a pack's community is found again by its slug.
#
# Each pack: slug, title, type (a community type of app_data/vocabularies/
# community_types.yaml: journal, blog, repository, organization or funder),
# logo (an image in app_data/starter_packs, at most
# 1 MB, set while the community has none), description, website,
# organizations (the ROR ids of the organizations its works come from, the
# community's organizations, resolved from the commonmeta store), and
# custom_fields, the community's rs: fields that select its works
# (invenio_rdm_starter.custom_fields): rs:issn, rs:doi (the DOI of a blog or
# journal), rs:prefix (a DOI prefix), rs:language (a languages vocabulary id)
# and rs:license (a licenses vocabulary id).
- slug: joss
  title: Journal of Open Source Software
  type: journal
  logo: starter_packs/joss.png
  description: >-
    Archive of the Journal of Open Source Software (JOSS):
    papers describing Open Source research software, with their PDFs and software archives.
  website: https://joss.theoj.org/
  custom_fields:
    rs:issn: 2475-9066
    rs:prefix: "10.21105"
    rs:language: eng
    rs:license: cc-by-4.0
- slug: mhh
  title: Medizinische Hochschule Hannover
  type: organization
  logo: starter_packs/mhh.png
  description: >-
    Publications and their metadata from Hannover Medical School.
  website: https://mhh.de/
  organizations:
    - "00f2yqf98"
  custom_fields:
    rs:language: deu
- slug: wellcome
  title: Wellcome
  type: funder
  logo: starter_packs/wellcome.png
  description: >-
    Grants awarded by Wellcome and the publications they funded.
  website: https://wellcome.org/
  organizations:
    - "029chgv08"
  custom_fields:
    rs:language: eng
    rs:license: cc-by-4.0

