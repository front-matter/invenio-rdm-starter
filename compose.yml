# InvenioRDM Starter Docker Compose
#
# Usage::
#
#   $ docker compose up -d
#
# For Coolify, envy renders this file without proxy, database, cache and
# search (front-matter/configurable, coolify/inveniordm-starter/).
#
# The following services are included:
# - Reverse proxy: Caddy (exposed ports: 80, 443)
# - Web application: Gunicorn (exposed port: none)
# - Background tasks: Celery workers, one for the default queue and the beat
#   schedule, one for the low priority queue the jobs run on
# - DB: (PostgresSQL) (exposed port: 5432)
# - Cache and message queue: Redis (exposed port: 6379)
# - Search platform: (OpenSearch) (exposed ports: 9200, 9300)

# Envy configuration (https://github.com/front-matter/envy). The x-set-*
# blocks group the environment variables and are merged into the services.
# Coolify gets a copy without anchors and local-only services, written in
# front-matter/configurable with envy render --service web --service worker.
x-envy:
  HUGO_TITLE: InvenioRDM Starter
  HUGO_PARAMS_DESCRIPTION: >
    InvenioRDM is the open source turn-key research data management platform,
    with detailed documentation available [here](https://inveniordm.docs.cern.ch).
    InvenioRDM Starter facilitates deployment and configuration of InvenioRDM,
    allowing you to run InvenioRDM on your local computer within 15 min.
  HUGO_LANGUAGE_CODE: en-US
  HUGO_IGNORE_LOGS:
    - warning-goldmark-raw-html
  HUGO_MARKUP_GOLDMARK_UNSAFE: "true"
  HUGO_DEFAULT_CONTENT_LANGUAGE: "en"
  HUGO_DEFAULT_CONTENT_LANGUAGE_IN_SUBDIR: "false"
  HUGO_LANGUAGES: |
    en:
      languageName: English
      weight: 1

# Database, search, cache and application settings for web and worker.
x-set-base:
  # Flask-SQLAlchemy
  &base
  INVENIO_SQLALCHEMY_DATABASE_URI: ${INVENIO_SQLALCHEMY_DATABASE_URI:-postgresql+psycopg2://postgres:postgres@db/inveniordm}

  # Invenio-Search
  INVENIO_SEARCH_HOSTS: ${INVENIO_SEARCH_HOSTS:-['search:9200']}
  # Prefix of the search indices, so that instances can share a cluster.
  INVENIO_SEARCH_INDEX_PREFIX: ${INVENIO_SEARCH_INDEX_PREFIX:-invenio-rdm-}

  # Invenio-App Caches and Workers
  # User sessions. The config derives the other Redis/Valkey URLs from it:
  # Celery broker (database + 1), results (+ 2), rate limits (+ 3) and
  # cache (+ 4).
  INVENIO_ACCOUNTS_SESSION_REDIS_URL: ${INVENIO_ACCOUNTS_SESSION_REDIS_URL:-redis://cache:6379/0}

  # Flask-Babel
  INVENIO_BABEL_DEFAULT_LOCALE: ${INVENIO_BABEL_DEFAULT_LOCALE:-en}
  INVENIO_BABEL_DEFAULT_TIMEZONE: ${INVENIO_BABEL_DEFAULT_TIMEZONE:-UTC}

  # Flask core runtime tuning
  # How long browsers cache public files, in seconds.
  INVENIO_SEND_FILE_MAX_AGE_DEFAULT: ${INVENIO_SEND_FILE_MAX_AGE_DEFAULT:-300}

  # Rate limiting
  INVENIO_RATELIMIT_ENABLED: ${INVENIO_RATELIMIT_ENABLED:-True}
  # Request limits for signed-in users.
  INVENIO_RATELIMIT_AUTHENTICATED_USER: ${INVENIO_RATELIMIT_AUTHENTICATED_USER:-60000 per hour;1100 per minute}
  # Request limits for anonymous users.
  INVENIO_RATELIMIT_GUEST_USER: ${INVENIO_RATELIMIT_GUEST_USER:-30000 per hour;500 per minute}

  # Logging
  INVENIO_DEBUG: ${INVENIO_DEBUG:-False}
  # Level of the messages logged to the console and to files.
  INVENIO_LOGGING_CONSOLE_LEVEL: ${INVENIO_LOG_LEVEL:-WARNING}
  INVENIO_LOGGING_FS_LEVEL: ${INVENIO_LOG_LEVEL:-WARNING}
  INVENIO_CELERY_WORKER_REDIRECT_STDOUTS: ${INVENIO_CELERY_WORKER_REDIRECT_STDOUTS:-False}
  INVENIO_CELERY_WORKER_MAX_TASKS_PER_CHILD: ${INVENIO_CELERY_WORKER_MAX_TASKS_PER_CHILD:-200}

  # Invenio-RDM-Records
  INVENIO_RDM_ALLOW_METADATA_ONLY_RECORDS: ${INVENIO_RDM_ALLOW_METADATA_ONLY_RECORDS:-True}
  # Records can be restricted, not only public.
  INVENIO_RDM_ALLOW_RESTRICTED_RECORDS: ${INVENIO_RDM_ALLOW_RESTRICTED_RECORDS:-True}
  # Don't allow records with external DOIs to be versioned.
  INVENIO_RDM_ALLOW_EXTERNAL_DOI_VERSIONING: ${INVENIO_RDM_ALLOW_EXTERNAL_DOI_VERSIONING:-False}

  # Invenio-OAIServer: the worker publishes records too, so both need the
  # prefix for the OAI identifiers they mint.
  INVENIO_OAISERVER_ID_PREFIX: ${INVENIO_OAISERVER_ID_PREFIX:-invenio-rdm}

  # The citation styles offered on the landing page, comma-separated; the
  # config builds RDM_CITATION_STYLES from them. Not INVENIO_RDM_CITATION_STYLES:
  # invenio-config would replace the list with this string.
  INVENIO_RDM_CITATION_STYLES_LIST: ${INVENIO_RDM_CITATION_STYLES_LIST:-apa,chicago-author-date,harvard-cite-them-right,ieee,vancouver}
  # The citation style selected by default.
  INVENIO_RDM_CITATION_STYLES_DEFAULT: ${INVENIO_RDM_CITATION_STYLES_DEFAULT:-apa}

  # Error reports to GlitchTip or Sentry (invenio-logging).
  INVENIO_SENTRY_DSN: ${INVENIO_SENTRY_DSN:-}

  # Prometheus multiprocess metrics (Gunicorn)
  PROMETHEUS_MULTIPROC_DIR: ${PROMETHEUS_MULTIPROC_DIR:-/tmp/prometheus_multiproc}

  # Commonmeta store (ROR organizations and ORCID persons) for invenio-pidbox,
  # mounted from the host directory COMMONMETA_HOST_DIR (see the web and worker
  # volumes). The store is in WAL mode, which SQLite can only read where it can
  # create the -shm file beside it, so the mount is read-write and the host
  # directory must be writable by the container's group (gid 0):
  #   chmod 775 /var/lib/commonmeta
  # The database file stays read-only to the container (mode 444, owned by
  # root). commonmeta write commands run on the host while the containers read.
  COMMONMETA_DB: ${COMMONMETA_DB:-/var/lib/commonmeta/commonmeta.sqlite3}
  # Writable download cache for commonmeta; the container user has no
  # writable HOME. Ephemeral by design.
  XDG_CACHE_HOME: ${XDG_CACHE_HOME:-/tmp/commonmeta-cache}

  # Base URLs of the web pages and of the REST API.
  INVENIO_SITE_UI_URL: ${INVENIO_SITE_UI_URL:-https://localhost}
  INVENIO_SITE_API_URL: ${INVENIO_SITE_API_URL:-https://localhost/api}

  # Admin user
  INVENIO_ADMIN_EMAIL: ${INVENIO_ADMIN_EMAIL:-info@inveniosoftware.org}
  INVENIO_ADMIN_PASSWORD: ${INVENIO_ADMIN_PASSWORD:-changeme}

# Sending email.
x-set-mail:
  # Mail
  &mail
  # Don't send emails; False turns sending on.
  INVENIO_MAIL_SUPPRESS_SEND: ${INVENIO_MAIL_SUPPRESS_SEND:-True}
  INVENIO_MAIL_SERVER: ${INVENIO_MAIL_SERVER:-127.0.0.1}
  INVENIO_MAIL_PORT: ${INVENIO_MAIL_PORT:-587}
  INVENIO_MAIL_USERNAME: ${INVENIO_MAIL_USERNAME:-info}
  INVENIO_MAIL_PASSWORD: ${INVENIO_MAIL_PASSWORD:-}
  INVENIO_MAIL_USE_TLS: ${INVENIO_MAIL_USE_TLS:-True}
  INVENIO_MAIL_USE_SSL: ${INVENIO_MAIL_USE_SSL:-False}
  INVENIO_MAIL_DEFAULT_SENDER: ${INVENIO_MAIL_DEFAULT_SENDER:-}
  INVENIO_SECURITY_EMAIL_SENDER: ${INVENIO_SECURITY_EMAIL_SENDER:-}

# DOI registration and harvesting.
x-set-doi:
  # DOI Registration
  # See: https://inveniordm.docs.cern.ch/operate/customize/dois/
  &doi
  INVENIO_DATACITE_ENABLED: ${INVENIO_DATACITE_ENABLED:-False}
  # Production mode rather than InvenioRDM's test mode, once DataCite is on.
  INVENIO_DATACITE_TEST_MODE: ${INVENIO_DATACITE_TEST_MODE:-False}
  INVENIO_DATACITE_USERNAME: ${INVENIO_DATACITE_USERNAME:-}
  INVENIO_DATACITE_PASSWORD: ${INVENIO_DATACITE_PASSWORD:-}
  INVENIO_DATACITE_PREFIX: ${INVENIO_DATACITE_PREFIX:-}
  INVENIO_DATACITE_DATACENTER_SYMBOL: ${INVENIO_DATACITE_DATACENTER_SYMBOL:-}

# File storage in S3.
x-set-s3:
  # Invenio-S3
  # See: https://inveniordm.docs.cern.ch/operate/customize/file-uploads/s3/
  &s3
  INVENIO_S3_ENDPOINT_URL: ${INVENIO_S3_ENDPOINT_URL:-}
  INVENIO_S3_BUCKET_NAME: ${INVENIO_S3_BUCKET_NAME:-}
  INVENIO_S3_ACCESS_KEY_ID: ${INVENIO_S3_ACCESS_KEY_ID:-}
  INVENIO_S3_SECRET_ACCESS_KEY: ${INVENIO_S3_SECRET_ACCESS_KEY:-}
  INVENIO_S3_REGION_NAME: ${INVENIO_S3_REGION_NAME:-us-east-1}

# Web application: trusted hosts, languages, secret key and theme.
x-set-web:
  # Flask
  &web
  # The hosts the app answers for. In production, the site's host only, and
  # route only that host to the app.
  INVENIO_TRUSTED_HOSTS: ${INVENIO_TRUSTED_HOSTS:-['0.0.0.0', 'localhost', '127.0.0.1']}
  # Number of proxies in front of web (Caddy locally) whose X-Forwarded-*
  # headers are trusted.
  INVENIO_WSGI_PROXIES: ${INVENIO_WSGI_PROXIES:-1}

  # Invenio-I18N (exclude INVENIO_BABEL_DEFAULT_LOCALE)
  INVENIO_ISO639_LANGUAGES: ${INVENIO_ISO639_LANGUAGES:-de,es,fr}

  # Invenio-App
  INVENIO_SECRET_KEY: ${INVENIO_SECRET_KEY:-changeme}

  # Invenio-Theme
  # See: https://inveniordm.docs.cern.ch/operate/customize/look-and-feel/
  # Header logo.
  INVENIO_THEME_LOGO: ${INVENIO_THEME_LOGO:-images/starter-white.svg}
  # The name of the site, in the header and as the title.
  INVENIO_THEME_SITENAME: ${INVENIO_THEME_SITENAME:-InvenioRDM Starter}
  # Front page title and subtitle.
  INVENIO_THEME_FRONTPAGE_TITLE: ${INVENIO_THEME_FRONTPAGE_TITLE:-InvenioRDM Starter}
  INVENIO_THEME_FRONTPAGE_SUBTITLE: ${INVENIO_THEME_FRONTPAGE_SUBTITLE:-A starter project for the turn-key research data management repository.}
  # Show the front page intro section.
  INVENIO_THEME_SHOW_FRONTPAGE_INTRO_SECTION: ${INVENIO_THEME_SHOW_FRONTPAGE_INTRO_SECTION:-False}

# Authentication.
x-set-authentication:
  # Authentication
  # See: https://inveniordm.docs.cern.ch/operate/customize/authentication/
  &authentication
  # Whether or not login with local account credentials should be enabled.
  INVENIO_ACCOUNTS_LOCAL_LOGIN_ENABLED: ${INVENIO_ACCOUNTS_LOCAL_LOGIN_ENABLED:-True}
  # Default user visibility: restricted or public.
  INVENIO_ACCOUNTS_DEFAULT_USER_VISIBILITY: ${INVENIO_ACCOUNTS_DEFAULT_USER_VISIBILITY:-restricted}
  # Allow users to log in without first confirming their email address.
  INVENIO_SECURITY_LOGIN_WITHOUT_CONFIRMATION: ${INVENIO_SECURITY_LOGIN_WITHOUT_CONFIRMATION:-True}
  # Automatically redirect to the external login provider (with a single
  # OAuth provider).
  INVENIO_OAUTHCLIENT_AUTO_REDIRECT_TO_EXTERNAL_LOGIN: ${INVENIO_OAUTHCLIENT_AUTO_REDIRECT_TO_EXTERNAL_LOGIN:-False}
  # Make user profiles read-only, with the values from the OAuth login.
  INVENIO_USERPROFILES_READ_ONLY: ${INVENIO_USERPROFILES_READ_ONLY:-True}

  # Allow password change by users.
  INVENIO_SECURITY_CHANGEABLE: ${INVENIO_SECURITY_CHANGEABLE:-True}
  # Allow users to confirm their email address.
  INVENIO_SECURITY_CONFIRMABLE: ${INVENIO_SECURITY_CONFIRMABLE:-True}
  # Allow password recovery by users.
  INVENIO_SECURITY_RECOVERABLE: ${INVENIO_SECURITY_RECOVERABLE:-True}
  # Allow users to register.
  INVENIO_SECURITY_REGISTERABLE: ${INVENIO_SECURITY_REGISTERABLE:-True}
  # Enable user tracking on login.
  INVENIO_SECURITY_TRACKABLE: ${INVENIO_SECURITY_TRACKABLE:-True}

  # OAuth logins (site/invenio_rdm_starter/config.py). Keycloak and Authentik are configured when
  # their issuer is set, the others when their client id is.
  INVENIO_KEYCLOAK_ISSUER: ${INVENIO_KEYCLOAK_ISSUER:-}
  INVENIO_KEYCLOAK_CLIENT_ID: ${INVENIO_KEYCLOAK_CLIENT_ID:-}
  INVENIO_KEYCLOAK_CLIENT_SECRET: ${INVENIO_KEYCLOAK_CLIENT_SECRET:-}
  INVENIO_AUTHENTIK_ISSUER: ${INVENIO_AUTHENTIK_ISSUER:-}
  INVENIO_AUTHENTIK_CLIENT_ID: ${INVENIO_AUTHENTIK_CLIENT_ID:-}
  INVENIO_AUTHENTIK_CLIENT_SECRET: ${INVENIO_AUTHENTIK_CLIENT_SECRET:-}
  # Optional, default https://orcid.org; https://sandbox.orcid.org for a
  # sandbox client.
  INVENIO_ORCID_ISSUER: ${INVENIO_ORCID_ISSUER:-https://orcid.org}
  INVENIO_ORCID_CLIENT_ID: ${INVENIO_ORCID_CLIENT_ID:-}
  INVENIO_ORCID_CLIENT_SECRET: ${INVENIO_ORCID_CLIENT_SECRET:-}
  INVENIO_GITHUB_CLIENT_ID: ${INVENIO_GITHUB_CLIENT_ID:-}
  INVENIO_GITHUB_CLIENT_SECRET: ${INVENIO_GITHUB_CLIENT_SECRET:-}
  INVENIO_GOOGLE_CLIENT_ID: ${INVENIO_GOOGLE_CLIENT_ID:-}
  INVENIO_GOOGLE_CLIENT_SECRET: ${INVENIO_GOOGLE_CLIENT_SECRET:-}
  INVENIO_DISCORD_CLIENT_ID: ${INVENIO_DISCORD_CLIENT_ID:-}
  INVENIO_DISCORD_CLIENT_SECRET: ${INVENIO_DISCORD_CLIENT_SECRET:-}

services:
  proxy:
    image: caddy:2.10
    restart: "unless-stopped"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
  # The image is pulled if missing; a local build with the same name
  # (docker build -t ghcr.io/front-matter/invenio-rdm-starter .) is used instead.
  web:
    image: ${INVENIO_RDM_STARTER_IMAGE:-ghcr.io/front-matter/invenio-rdm-starter}:${INVENIO_RDM_STARTER_TAG:-latest}
    pull_policy: ${INVENIO_RDM_STARTER_PULL_POLICY:-missing}
    platform: linux/amd64
    expose:
      - "5000"
    volumes:
      - uploaded_data:/opt/invenio/var/instance/data
      - archived_data:/opt/invenio/var/instance/archive
      # Shared: one store for every instance on this host. Read-write so
      # SQLite can create the store's -shm; see COMMONMETA_DB above.
      - ${COMMONMETA_HOST_DIR:-/var/lib/commonmeta}:/var/lib/commonmeta
    healthcheck:
      test:
        - CMD
        - python3
        - '-c'
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/ping')"
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 40s
    environment:
      <<: [*base, *mail, *doi, *s3, *web, *authentication]
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      search:
        condition: service_healthy
        required: false
      cache:
        condition: service_healthy
        required: false
      db:
        condition: service_healthy
        required: false
  worker:
    image: ${INVENIO_RDM_STARTER_IMAGE:-ghcr.io/front-matter/invenio-rdm-starter}:${INVENIO_RDM_STARTER_TAG:-latest}
    pull_policy: ${INVENIO_RDM_STARTER_PULL_POLICY:-missing}
    platform: linux/amd64
    command: [ "celery", "-A", "invenio_app.celery", "worker", "--beat", "--schedule=/tmp/celerybeat-schedule", "--events", "--loglevel=WARNING" ]
    volumes:
      - uploaded_data:/opt/invenio/var/instance/data
      # Shared: one store for every instance on this host. Read-write so
      # SQLite can create the store's -shm; see COMMONMETA_DB above.
      - ${COMMONMETA_HOST_DIR:-/var/lib/commonmeta}:/var/lib/commonmeta
    environment:
      <<: [*base, *mail, *doi, *s3]
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      search:
        condition: service_healthy
        required: false
      cache:
        condition: service_healthy
        required: false
      db:
        condition: service_healthy
        required: false
  # The low priority queue: the jobs of the Jobs dashboard, which run there by
  # default (JOBS_DEFAULT_QUEUE), and the batches of a works import. A worker
  # of its own, so a long job doesn't hold up the default queue, with a few
  # processes, since every record an import saves reads the commonmeta store.
  # No --beat: only one worker may run the schedule.
  worker-low:
    image: ${INVENIO_RDM_STARTER_IMAGE:-ghcr.io/front-matter/invenio-rdm-starter}:${INVENIO_RDM_STARTER_TAG:-latest}
    pull_policy: ${INVENIO_RDM_STARTER_PULL_POLICY:-missing}
    platform: linux/amd64
    command: [ "celery", "-A", "invenio_app.celery", "worker", "--queues=low", "--hostname=low@%h", "--concurrency=${CELERY_LOW_CONCURRENCY:-2}", "--events", "--loglevel=WARNING" ]
    volumes:
      - uploaded_data:/opt/invenio/var/instance/data
      - ${COMMONMETA_HOST_DIR:-/var/lib/commonmeta}:/var/lib/commonmeta
    environment:
      <<: [*base, *mail, *doi, *s3]
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      search:
        condition: service_healthy
        required: false
      cache:
        condition: service_healthy
        required: false
      db:
        condition: service_healthy
        required: false
  celery-exporter:
    image: danihodovic/celery-exporter:0.12.2
    restart: "unless-stopped"
    command: [ "--broker-url=${INVENIO_CELERY_BROKER_URL:-redis://cache:6379/0}" ]
    ports:
      - "127.0.0.1:9808:9808"
    depends_on:
      cache:
        condition: service_healthy
        required: false
  cache:
    image: valkey/valkey:9.1.3
    restart: "unless-stopped"
    command: [ "valkey-server", "--loglevel", "warning" ]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
  db:
    image: postgres:17.4-bookworm
    restart: "unless-stopped"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-inveniordm}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 3s
      retries: 5
  search:
    image: opensearchproject/opensearch:2.19.7
    restart: "unless-stopped"
    volumes:
      - ./log4j2.properties:/usr/share/opensearch/config/log4j2.properties:ro
    environment:
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      discovery.type: "single-node"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 2g
    ports:
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9600:9600"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  uploaded_data:
  archived_data:
  db_data:
  caddy_data:
  caddy_config:
